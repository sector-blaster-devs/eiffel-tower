<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Remix Eiffel Tower 3D</title>
    <meta
      name="description"
      content="Explore Gustave Eiffel’s 1889 tower in 3D, reconstructed from original engineering plates and archival photos using Gemini 4 Carbon."
    />
    <meta property="og:title" content="Remix Eiffel Tower 3D" />
    <meta
      property="og:description"
      content="Explore Gustave Eiffel’s 1889 tower in 3D, reconstructed from original engineering plates and archival photos using Gemini 4 Carbon."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./story_and_archive/story_archive.css" />
    <style>
      #boot-veil {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-color: #121212;
        color: #f5f5f5;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot-veil.is-fading {
        opacity: 0;
        pointer-events: none;
      }
      .boot-veil-eyebrow {
        font-family: var(--font-sans);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a3a3a3;
      }
      .boot-veil-title {
        font-family: var(--font-serif);
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 400;
        letter-spacing: 0.06em;
        color: #f5f5f5;
      }
      .boot-veil-rule {
        width: 48px;
        height: 1px;
        background-color: #737373;
        margin-top: 4px;
      }
      #museum-brand-plaque {
        position: fixed;
        top: 20px;
        left: 24px;
        z-index: 18;
      }
      @media (max-width: 720px) {
        #museum-brand-plaque {
          display: none;
        }
      }
      @media (max-width: 600px) {
        .m2-placard {
          bottom: 94px !important;
          max-height: 56vh;
          max-height: min(56vh, calc(100dvh - 156px));
          overflow-y: auto;
          padding: 10px 12px 11px;
        }
        .m2-placard.is-collapsed {
          max-height: none;
          overflow-y: visible;
          padding: 9px 12px 10px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/",
          "museum/": "./"
        }
      }
    </script>
    <link rel="modulepreload" href="./startup_orchestrator.js" />
    <link rel="modulepreload" href="./pbr_worker.js" />
    <link rel="modulepreload" href="./app.js" />
    <link rel="modulepreload" href="./vendor/three/three.module.js" />
    <link rel="modulepreload" href="./vendor/three/three.core.js" />
    <link rel="modulepreload" href="./vendor/three/addons/controls/OrbitControls.js" />
    <link rel="modulepreload" href="./model/tower_controller.js" />
    <link rel="modulepreload" href="./model/materials.js" />
    <link rel="modulepreload" href="./model/floor_textures.js" />
    <link rel="modulepreload" href="./world/paris_1889.js" />
    <link rel="modulepreload" href="./world/atmosphere.js" />
    <link rel="modulepreload" href="./portals/photo_portals.js" />
    <link rel="modulepreload" href="./perf/fps_and_drawcalls/index.js" />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="./references/plans/structural_and_elevation_plates/55_Eiffel_1900_Planche_I_Elevation_Wikimedia_PD.jpg"
    />
  </head>
  <body>
    <main id="stage-viewport" aria-label="La Tour de 300 Mètres 1887–1889 Exhibition Stage">
      <canvas id="world-canvas"></canvas>
      <div id="portal-overlay-root" aria-hidden="true"></div>
      <div id="vignette-layer" aria-hidden="true"></div>
    </main>

    <div id="museum-ui-root">
      <div id="museum-brand-plaque" class="m2-brand-mark" aria-hidden="true">
        <span class="m2-brand-title" id="brand-plaque-title">La Tour de 300 Mètres</span>
        <span class="m2-brand-subtitle" id="brand-plaque-sub">1887–1889 Archival Exhibition</span>
      </div>
    </div>

    <div id="boot-veil" role="status" aria-live="polite">
      <span class="boot-veil-eyebrow">Paris · Champ-de-Mars · 1887–1889</span>
      <span class="boot-veil-title">La Tour de 300 Mètres</span>
      <span class="boot-veil-rule" aria-hidden="true"></span>
    </div>

    <script type="module" async src="./startup_orchestrator.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
